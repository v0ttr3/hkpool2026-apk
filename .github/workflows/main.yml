name: Build APK - HK Pool 2026

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # HAPUS setup-android@v3 yang error, pakai SDK bawaan runner
      - name: Setup Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls -la /usr/local/lib/android/sdk || echo "checking sdk"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Generate Full Project (fix missing files)
        run: |
          mkdir -p app/src/main/java/com/hkpool/app/data
          mkdir -p app/src/main/java/com/hkpool/app/util
          mkdir -p app/src/main/java/com/hkpool/app/analysis
          mkdir -p app/src/main/java/com/hkpool/app/ui

          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'kotlin-kapt' }
          android {
              namespace 'com.hkpool.app'
              compileSdk 34
              defaultConfig { applicationId "com.hkpool.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = '1.8' }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.navigation:navigation-compose:2.7.6'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'
              implementation 'org.apache.poi:poi:5.2.5'
              implementation 'org.apache.poi:poi-ooxml:5.2.5'
              implementation 'androidx.documentfile:documentfile:1.0.1'
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="HK Pool 2026" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".ui.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/hkpool/app/data/ResultEntity.kt <<'KT'
          package com.hkpool.app.data
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          @Entity(tableName = "hk_results")
          data class ResultEntity(@PrimaryKey val date: String, val number: String, val asDigit: Int, val kop: Int, val kepala: Int, val ekor: Int, val timestamp: Long = System.currentTimeMillis())
          KT

          cat > app/src/main/java/com/hkpool/app/data/ResultDao.kt <<'KT'
          package com.hkpool.app.data
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow
          @Dao
          interface ResultDao {
              @Query("SELECT * FROM hk_results ORDER BY date DESC") fun getAllFlow(): Flow<List<ResultEntity>>
              @Query("SELECT * FROM hk_results ORDER BY date DESC") suspend fun getAll(): List<ResultEntity>
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insertAll(items: List<ResultEntity>)
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insert(item: ResultEntity)
          }
          KT

          cat > app/src/main/java/com/hkpool/app/data/AppDatabase.kt <<'KT'
          package com.hkpool.app.data
          import androidx.room.Database
          import androidx.room.RoomDatabase
          @Database(entities = [ResultEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase: RoomDatabase() { abstract fun resultDao(): ResultDao }
          KT

          cat > app/src/main/java/com/hkpool/app/util/CalendarImporter.kt <<'KT'
          package com.hkpool.app.util
          import com.hkpool.app.data.ResultEntity
          import org.apache.poi.ss.usermodel.WorkbookFactory
          import java.io.InputStream
          import java.time.LocalDate
          object CalendarImporter {
              fun importFromExcel(input: InputStream, year: Int = 2026): List<ResultEntity> {
                  val wb = WorkbookFactory.create(input)
                  val sheet = wb.getSheetAt(0)
                  val startDate = LocalDate.of(year,1,1)
                  val firstDayCol = when(startDate.dayOfWeek.value) {1->0;2->1;3->2;4->3;5->4;6->5;7->6; else->3}
                  val results = mutableListOf<ResultEntity>()
                  for (r in 2 until sheet.physicalNumberOfRows) {
                      val row = sheet.getRow(r) ?: continue
                      for (c in 0..6) {
                          val cell = row.getCell(c) ?: continue
                          val raw = try { when(cell.cellType) { org.apache.poi.ss.usermodel.CellType.NUMERIC -> cell.numericCellValue.toInt(); org.apache.poi.ss.usermodel.CellType.STRING -> cell.stringCellValue.trim().toIntOrNull() ?: continue; else -> continue } } catch (e:Exception){ continue }
                          if (raw<0 || raw>9999) continue
                          val normalized = String.format("%04d", raw)
                          val offset = (r-2)*7 + (c - firstDayCol)
                          if (offset<0) continue
                          val date = startDate.plusDays(offset.toLong())
                          if (date.year!=year) continue
                          results.add(ResultEntity(date.toString(), normalized, normalized[0].digitToInt(), normalized[1].digitToInt(), normalized[2].digitToInt(), normalized[3].digitToInt()))
                      }
                  }
                  wb.close()
                  return results.sortedBy { it.date }
              }
          }
          KT

          cat > app/src/main/java/com/hkpool/app/analysis/PredictionEngine.kt <<'KT'
          package com.hkpool.app.analysis
          import com.hkpool.app.data.ResultEntity
          import kotlin.math.max
          data class DigitScore(val digit:Int, val score:Double, val freq:Int, val gap:Int, val trend:Double)
          data class PredictionResult(val scores:List<DigitScore>, val hidup:List<Int>, val mati:List<Int>, val ganjil:List<Int>, val genap:List<Int>, val ikut:List<Int>, val main:List<Int>, val keluar4D:List<String>, val keluar3D:List<String>, val keluar2D:List<String>, val explanation:String)
          object PredictionEngine {
              fun calculate(results:List<ResultEntity>, maxDigits:Int=7): PredictionResult {
                  if(results.isEmpty()) return PredictionResult(emptyList(),emptyList(),emptyList(),emptyList(),emptyList(),emptyList(),emptyList(),emptyList(),emptyList(),emptyList(),"Belum ada data")
                  val sorted = results.sortedBy { it.date }
                  val last = sorted.last()
                  val lastDigits = last.number.map { it.digitToInt() }
                  val last90 = sorted.takeLast(90)
                  val last30 = sorted.takeLast(30)
                  val freq90 = IntArray(10)
                  val freq30 = IntArray(10)
                  for(r in last90){ for(ch in r.number) freq90[ch.digitToInt()]++ }
                  for(r in last30){ for(ch in r.number) freq30[ch.digitToInt()]++ }
                  val lastSeenGap = IntArray(10)
                  for(d in 0..9){ var gap=0; for(i in sorted.indices.reversed()){ if(sorted[i].number.contains(d.toString())) break; gap++ }; lastSeenGap[d]=gap }
                  val coOcc = Array(10){IntArray(10)}
                  for(i in 0 until sorted.size-1){ val cur = sorted[i].number.map { it.digitToInt() }.toSet(); val nxt = sorted[i+1].number.map { it.digitToInt() }.toSet(); for(cd in cur) for(nd in nxt) coOcc[cd][nd]++ }
                  val ikutScore = IntArray(10)
                  for(ld in lastDigits) for(d in 0..9) ikutScore[d]+=coOcc[ld][d]
                  val scores = (0..9).map { d-> val freqNorm = freq90[d] / max(1.0, last90.size*4.0); val gapScore = 1.0/(lastSeenGap[d]+1.0); val trend = if(freq90[d]==0) 0.0 else (freq30[d]/30.0)/(freq90[d]/90.0); val trendNorm = (trend.coerceIn(0.0,2.0)/2.0); val finalScore = 0.40*freqNorm + 0.30*gapScore + 0.20*trendNorm; DigitScore(d, finalScore, freq90[d], lastSeenGap[d], trend) }.sortedByDescending { it.score }
                  val hidup = scores.take(maxDigits).map { it.digit }
                  val mati = scores.takeLast(maxDigits).map { it.digit }.filter { it !in hidup }
                  val ganjil = scores.filter { it.digit%2==1 }.take(maxDigits).map { it.digit }
                  val genap = scores.filter { it.digit%2==0 }.take(maxDigits).map { it.digit }
                  val ikutRanked = (0..9).sortedByDescending { ikutScore[it] }.take(maxDigits)
                  val main = hidup.intersect(ikutRanked.toSet()).toList().ifEmpty { hidup.take(3) }
                  val keluar4D = mutableListOf<String>().apply { if(hidup.size>=4) add(hidup.take(4).joinToString("") { it.toString() }); for(a in hidup.take(6)) for(b in hidup.take(6)) for(c in hidup.take(6)) for(d in hidup.take(6)){ if(size>=20) break; if(setOf(a,b,c,d).size==1) continue; add("$a$b$c$d") } }.distinct().take(12)
                  val keluar3D = keluar4D.map { it.takeLast(3) }.distinct().take(12)
                  val keluar2D = keluar4D.map { it.takeLast(2) }.distinct().take(12)
                  return PredictionResult(scores, hidup, mati, ganjil, genap, ikutRanked, main, keluar4D, keluar3D, keluar2D, "Hidup=${hidup.joinToString("")} Mati=${mati.joinToString("")} no-overlap")
              }
              fun generateBBFS(digits:List<Int>): List<String>{ val res = mutableSetOf<String>(); for(a in digits) for(b in digits) for(c in digits) for(d in digits){ if(setOf(a,b,c,d).size<2) continue; res.add("$a$b$c$d") }; return res.toList().take(200) }
              fun generateTarung(groupA:List<Int>, groupB:List<Int>): List<String>{ val res = mutableListOf<String>(); for(a in groupA) for(b in groupB){ res.add("$a$b"); res.add("$b$a") }; return res.distinct().take(120) }
          }
          KT

          cat > app/src/main/java/com/hkpool/app/ui/MainActivity.kt <<'KT'
          package com.hkpool.app.ui
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.MaterialTheme
          import androidx.room.Room
          import com.hkpool.app.data.AppDatabase
          class MainActivity: ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val db = Room.databaseBuilder(applicationContext, AppDatabase::class.java, "hkpool.db").fallbackToDestructiveMigration().build()
                  setContent { MaterialTheme { AppNav(db, this) } }
              }
          }
          KT

          cat > app/src/main/java/com/hkpool/app/ui/AppNav.kt <<'KT'
          package com.hkpool.app.ui
          import android.content.Context
          import android.net.Uri
          import android.widget.Toast
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.hkpool.app.analysis.PredictionEngine
          import com.hkpool.app.data.AppDatabase
          import com.hkpool.app.data.ResultEntity
          import com.hkpool.app.util.CalendarImporter
          import kotlinx.coroutines.launch
          import java.time.LocalDate
          @Composable
          fun AppNav(db: AppDatabase, activityContext: Context) {
              var results by remember { mutableStateOf<List<ResultEntity>>(emptyList()) }
              var tab by remember { mutableStateOf(0) }
              var prediction by remember { mutableStateOf(PredictionEngine.calculate(emptyList())) }
              val scope = rememberCoroutineScope()
              val context = LocalContext.current
              fun refresh(){ scope.launch { val all = db.resultDao().getAll(); results = all; prediction = PredictionEngine.calculate(all) } }
              LaunchedEffect(Unit){ refresh() }
              val excelLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()){ uri: Uri? ->
                  if(uri!=null){ scope.launch { try{ val input = context.contentResolver.openInputStream(uri)!!; val imported = CalendarImporter.importFromExcel(input); db.resultDao().insertAll(imported); Toast.makeText(context, "Import ${imported.size}", Toast.LENGTH_LONG).show(); refresh() }catch(e:Exception){ Toast.makeText(context, "Gagal: ${e.message}", Toast.LENGTH_LONG).show() } } }
              }
              Scaffold(topBar = { Column(Modifier.padding(16.dp)){ Text("HK POOL 2026", style=MaterialTheme.typography.headlineSmall); Text("${results.size} data") } }, bottomBar = { NavigationBar{ NavigationBarItem(selected=tab==0, onClick={tab=0}, label={Text("Kalender")}, icon={Text("📅")}); NavigationBarItem(selected=tab==1, onClick={tab=1}, label={Text("Daftar")}, icon={Text("📋")}); NavigationBarItem(selected=tab==2, onClick={tab=2}, label={Text("Prediksi")}, icon={Text("🎯")}) } }){ pad -> Column(Modifier.padding(pad).padding(12.dp)){ Button(onClick={excelLauncher.launch("*/*")}){ Text("Import Excel") }; when(tab){0->CalendarView(results);1->ListView(results);2->PredictionView(prediction)} } }
          }
          @Composable fun CalendarView(results:List<ResultEntity>){ val byDate = results.associateBy { it.date }; val start = LocalDate.of(2026,1,1); val end = LocalDate.of(2026,10,29); Column{ LazyColumn{ var cur = start; val weeks = mutableListOf<List<LocalDate?>>(); var week = mutableListOf<LocalDate?>(); val firstCol = start.dayOfWeek.value-1; repeat(firstCol){ week.add(null) }; while(cur <= end){ week.add(cur); if(week.size==7){ weeks.add(week.toList()); week=mutableListOf() }; cur = cur.plusDays(1) }; if(week.isNotEmpty()){ while(week.size<7) week.add(null); weeks.add(week) }; items(weeks.size){ idx -> val w = weeks[idx]; Row(Modifier.fillMaxWidth()){ w.forEach{ date -> Box(Modifier.weight(1f).aspectRatio(1f).padding(2.dp).border(0.5.dp, Color.Gray).background(if(date!=null && byDate[date.toString()]!=null) Color(0xFFE3F2FD) else Color.White), contentAlignment=Alignment.Center){ if(date!=null){ val res = byDate[date.toString()]; Column(horizontalAlignment=Alignment.CenterHorizontally){ Text("${date.dayOfMonth}", style=MaterialTheme.typography.labelSmall); if(res!=null) Text(res.number, style=MaterialTheme.typography.bodySmall, color=if(res.number.startsWith("0")) Color.Red else Color.Black) } } } } } } } } }
          @Composable fun ListView(results:List<ResultEntity>){ LazyColumn{ items(results.take(300)){ r-> Card{ Row(Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement=Arrangement.SpaceBetween){ Text(r.date); Text(r.number) } } } } }
          @Composable fun PredictionView(pred:com.hkpool.app.analysis.PredictionResult){ LazyColumn{ item{ Card{ Column(Modifier.padding(12.dp)){ Text(pred.explanation); Text("Hidup: ${pred.hidup.joinToString("")}"); Text("Mati: ${pred.mati.joinToString("")}"); Text("Ikut: ${pred.ikut.joinToString("")} Main: ${pred.main.joinToString("")}"); Text("4D: ${pred.keluar4D.joinToString(", ")}") } } } } }
          KT

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HKPool2026-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
